name: Promote to master

# 日常 promote 已内置在 CI and Publish（verify 后置 job，经 Release PR merge）。
# 此处仅保留手动 / 应急；勿再对 CI 使用 workflow_run（与内置 promote 重复）。
on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: 要 promote 的发布轨分支（如 dev_00_14_00）
        required: true
        type: string

jobs:
  promote:
    permissions: {}
    uses: workers-world/.github/.github/workflows/worker-promote.yml@actions/v0.4.28
    with:
      release_branch: ${{ inputs.release_branch }}
    secrets: inherit
