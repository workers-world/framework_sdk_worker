name: Create GitHub Release

# push v* tag → GitHub Release 页面（与 npm publish 解耦；tag 须已存在）。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/create-gh-release.yml
    secrets:
      GHA_TOKEN: ${{ secrets.WORKERS_WORLD_GHA_TOKEN }}
    with:
      tag_name: ${{ github.ref_name }}
