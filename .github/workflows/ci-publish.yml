# master push / tag / dispatch：verify → publish。
# PR → dev_*：仅 verify（不发布）。
# dev_* → master 合入请在 GitHub 手动开 PR / merge；本仓为 public，不可调用私有 workers-world/.github reusable workflow。
name: CI and Publish

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:
    branches: ["dev_*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ${{ vars.WORKERS_WORLD_GHA_RUNNER != '' && vars.WORKERS_WORLD_GHA_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

  publish:
    needs: verify
    if: >
      needs.verify.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/v') ||
        github.ref == 'refs/heads/master'
      )
    runs-on: ${{ vars.WORKERS_WORLD_GHA_RUNNER != '' && vars.WORKERS_WORLD_GHA_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref || 'refs/heads/master' }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@workers-world"

      - run: npm ci
      - run: npm run build

      # GitHub Packages 要求 scope=org；本地/file: 依赖仍用 unscoped 名 framework_sdk_worker
      # 同版本不可覆盖（E409）；已发布则跳过，避免 master 重跑失败。
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          PKG="@workers-world/framework_sdk_worker"
          if npm view "${PKG}@${VERSION}" version >/dev/null 2>&1; then
            echo "Skip publish: ${PKG}@${VERSION} already exists"
            exit 0
          fi
          npm pkg set "name=${PKG}"
          npm publish
