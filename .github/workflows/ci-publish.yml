# push dev_*：sync-lock → verify。
# dev_* → master PR 合入（push master）：publish。
name: CI and Publish

on:
  push:
    branches: ["dev_*", "master"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  sync-lock:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/dev_')
    permissions:
      contents: write
      packages: read
    runs-on: ${{ vars.WORKERS_WORLD_GHA_RUNNER != '' && vars.WORKERS_WORLD_GHA_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKERS_WORLD_GHA_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/sync-package-lock
        with:
          push-token: ${{ secrets.WORKERS_WORLD_GHA_TOKEN || secrets.GITHUB_TOKEN }}

  verify:
    needs: sync-lock
    if: >
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/dev_') &&
      (needs.sync-lock.result == 'success' || needs.sync-lock.result == 'skipped')
    runs-on: ${{ vars.WORKERS_WORLD_GHA_RUNNER != '' && vars.WORKERS_WORLD_GHA_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pull lock commit from sync-lock job
        if: needs.sync-lock.result == 'success'
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

  publish:
    needs: verify
    if: >
      always() &&
      (
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/master' &&
          needs.verify.result == 'skipped'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          (needs.verify.result == 'success' || needs.verify.result == 'skipped')
        )
      )
    runs-on: ${{ vars.WORKERS_WORLD_GHA_RUNNER != '' && vars.WORKERS_WORLD_GHA_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/master

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@workers-world"

      - run: npm ci
      - run: npm run build

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          PKG="@workers-world/framework_sdk_worker"
          if npm view "${PKG}@${VERSION}" version >/dev/null 2>&1; then
            echo "Skip publish: ${PKG}@${VERSION} already exists"
            exit 0
          fi
          npm pkg set "name=${PKG}"
          npm publish
