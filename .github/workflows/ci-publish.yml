# dev_* push：verify → promote（FF master）→ publish（同一次 workflow）。
# master push / tag / dispatch：verify → publish。
# promote 用 GITHUB_TOKEN push 时 GitHub 不会触发 master 上的新 workflow，故 publish 须在 dev 链内完成。
# 勿向 master 开 PR Merge，否则 promote FF 会失败。
name: CI and Publish

on:
  push:
    branches: ["dev_*", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["dev_*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

  promote:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/dev_')
    permissions:
      contents: write
    uses: workers-world/.github/.github/workflows/worker-promote.yml@master
    with:
      release_branch: ${{ github.ref_name }}
    secrets: inherit

  publish:
    needs: [verify, promote]
    if: >
      always() &&
      needs.verify.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/v') ||
        github.ref == 'refs/heads/master' ||
        (
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/heads/dev_') &&
          needs.promote.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@workers-world"

      - run: npm ci
      - run: npm run build

      # GitHub Packages 要求 scope=org；本地/file: 依赖仍用 unscoped 名 framework_sdk_worker
      # 同版本不可覆盖（E409）；已发布则跳过，避免 master 重跑失败。
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          PKG="@workers-world/framework_sdk_worker"
          if npm view "${PKG}@${VERSION}" version >/dev/null 2>&1; then
            echo "Skip publish: ${PKG}@${VERSION} already exists"
            exit 0
          fi
          npm pkg set "name=${PKG}"
          npm publish
