# dev_* push：verify → promote（开 Release PR + merge）→ publish（同一次 workflow）。
# master push / tag / dispatch：verify → publish。
# promote 经 PAT merge PR（禁止直推 master）；publish 仍在 dev 链内完成（不依赖 master 上再触发 workflow）。
name: CI and Publish

on:
  push:
    branches: ["dev_*", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["dev_*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

  promote:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/dev_')
    # 写操作走 PAT；须 WORKERS_WORLD_GHA_TOKEN
    permissions: {}
    uses: workers-world/.github/.github/workflows/worker-promote.yml@actions/v0.4.10
    with:
      release_branch: ${{ github.ref_name }}
    secrets: inherit

  publish:
    needs: [verify, promote]
    if: >
      always() &&
      needs.verify.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/v') ||
        github.ref == 'refs/heads/master' ||
        (
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/heads/dev_') &&
          needs.promote.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    steps:
      # 发布轨：始终从 master 取代码（dev push 路径在 promote FF 之后与 dev tip 同 SHA）
      - uses: actions/checkout@v7
        with:
          ref: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref || 'refs/heads/master' }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@workers-world"

      - run: npm ci
      - run: npm run build

      # GitHub Packages 要求 scope=org；本地/file: 依赖仍用 unscoped 名 framework_sdk_worker
      # 同版本不可覆盖（E409）；已发布则跳过，避免 master 重跑失败。
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          PKG="@workers-world/framework_sdk_worker"
          if npm view "${PKG}@${VERSION}" version >/dev/null 2>&1; then
            echo "Skip publish: ${PKG}@${VERSION} already exists"
            exit 0
          fi
          npm pkg set "name=${PKG}"
          npm publish
