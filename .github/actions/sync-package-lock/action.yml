name: Sync package-lock.json
description: package.json 根依赖变更时自动刷新 package-lock.json 并提交回当前分支

inputs:
  push-token:
    description: git push 用 token
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: "22"

    - id: check
      shell: bash
      run: |
        set -euo pipefail
        script="${{ github.action_path }}/lock-matches-package-json.mjs"
        if node "$script"; then
          echo "in_sync=true" >> "$GITHUB_OUTPUT"
        else
          echo "in_sync=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Lock already in sync
      if: steps.check.outputs.in_sync == 'true'
      shell: bash
      run: echo "lock 已与 package.json 同步，跳过"

    - name: Regenerate package-lock.json
      if: steps.check.outputs.in_sync != 'true'
      shell: bash
      env:
        PUSH_TOKEN: ${{ inputs.push-token }}
      run: |
        set -euo pipefail

        git fetch origin "${GITHUB_REF_NAME}"
        git pull --ff-only origin "${GITHUB_REF_NAME}"

        root_deps_in_sync() {
          [[ -f package-lock.json ]] || return 1
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const root = lock.packages?.[""] || {};
            function same(a, b) {
              const aa = a || {};
              const bb = b || {};
              const keys = new Set([...Object.keys(aa), ...Object.keys(bb)]);
              for (const k of keys) {
                if (String(aa[k] ?? "") !== String(bb[k] ?? "")) process.exit(1);
              }
            }
            same(pkg.dependencies, root.dependencies);
            same(pkg.devDependencies, root.devDependencies);
          '
        }

        echo "按 package.json 刷新 package-lock.json"
        npm install --ignore-scripts --no-fund --no-audit

        if ! root_deps_in_sync; then
          echo "::error::刷新后 package-lock 根依赖仍与 package.json 不一致。"
          exit 1
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add package-lock.json
        if git diff --cached --quiet; then
          echo "package-lock 与 remote 一致，无需提交"
          exit 0
        fi
        git commit -m "CI action 自动刷新 package-lock" -m "package.json 根依赖与 lock 不一致时由 sync-lock job 生成。"

        push_with_rebase() {
          git fetch origin "${GITHUB_REF_NAME}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
        }

        if push_with_rebase; then
          exit 0
        fi
        echo "push 被拒，rebase 后重试一次…"
        push_with_rebase
